services:
  mysql:
    image: mysql:8.0
    container_name: devsecops-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: userdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    image: java-devsecops/user-service:local
    container_name: user-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: userdb
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: devsecops-platform-jwt-secret-2026-local-development-key
      JWT_EXPIRATION: 3600000
    ports:
      - "8081:8081"
    depends_on:
      mysql: 
        condition: service_healthy

  
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    image: java-devsecops/product-service:local
    container_name: product-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: productdb
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: devsecops-platform-jwt-secret-2026-local-development-key
    ports:
      - "8082:8082"
    depends_on:
      mysql: 
        condition: service_healthy


  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    image: java-devsecops/order-service:local
    container_name: order-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: orderdb
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: devsecops-platform-jwt-secret-2026-local-development-key
      PRODUCT_SERVICE_URL: http://product-service:8082
    ports:
      - "8083:8083"
    depends_on:
      mysql: 
        condition: service_healthy
      product-service:
        condition: service_started
volumes:
  mysql_data:
