apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: devsecops-gateway
  namespace: devsecops
spec:
  gatewayClassName: aws-alb

  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: devsecops-alb-config

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
