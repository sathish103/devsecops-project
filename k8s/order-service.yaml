apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: order-service
  namespace: devsecops

spec:
  replicas: 1

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: 124666675720.dkr.ecr.ap-south-1.amazonaws.com/devsecops-order-service

          command:
            - java
          args:
            - "-javaagent:/otel/opentelemetry-javaagent.jar"
            - "-jar"
            - "/app/app.jar"

          ports:
            - containerPort: 8083

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: OTEL_SERVICE_NAME
              value: order-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_HOST

            - name: DB_NAME
              value: orderdb

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_PORT

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: JWT_SECRET

            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8082

  strategy:
    blueGreen:
      activeService: order-service
      previewService: order-service-preview

      autoPromotionEnabled: false

      scaleDownDelaySeconds: 30

      previewReplicaCount: 1

---

apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: devsecops
  labels:
    app: order-service

spec:
  selector:
    app: order-service

  ports:
    - name: http
      port: 8083
      targetPort: 8083

  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: order-service-preview
  namespace: devsecops
  labels:
    app: order-service

spec:
  selector:
    app: order-service

  ports:
    - name: http
      port: 8083
      targetPort: 8083

  type: ClusterIP