apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service
  namespace: devsecops
spec:
  replicas: 1

  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 425034746703.dkr.ecr.ap-south-1.amazonaws.com/devsecops-user-service

          command:
            - java
          args:
            - "-javaagent:/otel/opentelemetry-javaagent.jar"
            - "-jar"
            - "/app/app.jar"

          ports:
            - containerPort: 8081

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            - name: OTEL_SERVICE_NAME
              value: user-service

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.tempo.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_HOST

            - name: DB_NAME
              value: userdb

            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_PORT

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_USERNAME

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: DB_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: devsecops-secrets
                  key: JWT_EXPIRATION

  strategy:
    blueGreen:
      activeService: user-service
      previewService: user-service-preview

      autoPromotionEnabled: false

      scaleDownDelaySeconds: 30

      previewReplicaCount: 1

---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: devsecops
  labels:
    app: user-service
spec:
  selector:
    app: user-service

  ports:
    - name: http
      port: 8081
      targetPort: 8081

  type: ClusterIP


---
apiVersion: v1
kind: Service
metadata:
  name: user-service-preview
  namespace: devsecops
  labels:
    app: user-service
spec:
  selector:
    app: user-service

  ports:
    - name: http
      port: 8081
      targetPort: 8081

  type: ClusterIP