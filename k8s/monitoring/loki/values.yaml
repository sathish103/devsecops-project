deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: s3
    bucketNames:
      chunks: devsecops-loki-ap-south-1-425034746703
      ruler: devsecops-loki-ap-south-1-425034746703
      admin: devsecops-loki-ap-south-1-425034746703

    s3:
      region: ap-south-1

  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

serviceAccount:
  create: true
  name: loki

  automountServiceAccountToken: true

  annotations: {}

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

gateway:
  enabled: true

monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

  lokiCanary:
    enabled: false

test:
  enabled: false

chunksCache:
  enabled: false

resultsCache:
  enabled: false

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0
