grafana:
  enabled: true

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    serviceMonitorSelector: {}

    serviceMonitorNamespaceSelector: {}

    ruleSelector:
      matchLabels:
        release: monitoring

    ruleNamespaceSelector: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    # Alertmanager will use the configuration generated by Helm below.
    configSecret: ""

    # Allow Prometheus Operator to use PrometheusRules from all namespaces.
    # Our custom rules are in the monitoring namespace and target
    # workloads in devsecops namespace.
    alertmanagerConfigSelector: {}
    alertmanagerConfigNamespaceSelector: {}

  config:
    global:
      resolve_timeout: 5m

      smtp_smarthost: smtp.gmail.com:587
      smtp_from: sathishcool444@gmail.com
      smtp_auth_username: sathishcool444@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail/smtp-auth-password
      smtp_require_tls: true

    route:
      receiver: devsecops-gmail
      group_by:
        - alertname
        - namespace
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

    receivers:
      - name: devsecops-gmail
        email_configs:
          - to: sathishcool444@gmail.com
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal:
          - namespace
          - alertname

      - source_match:
          severity: warning
        target_match:
          severity: info
        equal:
          - namespace
          - alertname