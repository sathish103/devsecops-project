grafana:
  enabled: true

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    serviceMonitorSelector: {}

    serviceMonitorNamespaceSelector: {}

    ruleSelector:
      matchLabels:
        release: monitoring

    ruleNamespaceSelector: {}

alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1

    # Mount the Gmail SMTP Secret into Alertmanager.
    secrets:
      - alertmanager-gmail

    # We are NOT using AlertmanagerConfig CRDs.
    alertmanagerConfigSelector: {}

    alertmanagerConfigNamespaceSelector: {}

  config:
    global:
      resolve_timeout: 5m

      smtp_smarthost: smtp.gmail.com:587
      smtp_from: sathishcool444@gmail.com
      smtp_auth_username: sathishcool444@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail/smtp-auth-password
      smtp_require_tls: true

    route:
      receiver: devsecops-gmail

      group_by:
        - alertname
        - namespace
        - severity

      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

    receivers:
      # IMPORTANT:
      # Keep the null receiver defined.
      # This prevents the "undefined receiver null" error.
      - name: null

      - name: devsecops-gmail
        email_configs:
          - to: sathishcool444@gmail.com
            send_resolved: true

    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - namespace
          - alertname

      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - namespace
          - alertname
        