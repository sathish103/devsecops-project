tempo:
  reportingEnabled: false

  metricsGenerator:
    enabled: false

  storage:
    trace:
      backend: s3
      s3:
        bucket: devsecops-tempo-ap-south-1-425034746703
        endpoint: s3.ap-south-1.amazonaws.com
        region: ap-south-1
        insecure: false
      wal:
        path: /var/tempo/wal

persistence:
  enabled: true
  storageClassName: gp3
  accessModes:
    - ReadWriteOnce
  size: 10Gi