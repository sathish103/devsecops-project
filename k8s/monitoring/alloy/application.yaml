apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:sathish103/devsecops-project.git
    targetRevision: main
    path: k8s/monitoring/alloy

    helm:
      releaseName: alloy
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: alloy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true