apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: devsecops-services
  namespace: devsecops
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - user-service
          - product-service
          - order-service

  namespaceSelector:
    matchNames:
      - devsecops

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s